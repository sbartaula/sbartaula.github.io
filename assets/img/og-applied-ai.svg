    <circle cx="807" cy="454" r="10" fill="#0F766E"/>
    <text x="832" y="447" class="sans" fill="#4F645D" font-size="14" font-weight="700" letter-spacing="2">WORKING PRODUCT</text>
    <text x="832" y="469" class="sans" fill="#14211D" font-size="18" font-weight="600">Ship, evaluate, improve</text>
