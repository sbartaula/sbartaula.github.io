    <text x="95" y="395" fill="#DDF4EF">LLM apps</text>
    <rect x="214" y="368" width="150" height="42" rx="21" fill="#D6ECE9" fill-opacity="0.12" stroke="#71B9AF"/>
    <text x="238" y="395" fill="#DDF4EF">AI workflows</text>
    <rect x="380" y="368" width="174" height="42" rx="21" fill="#D6ECE9" fill-opacity="0.12" stroke="#71B9AF"/>
    <text x="405" y="395" fill="#DDF4EF">Computer vision</text>
  </g>

  <text x="72" y="534" class="sans" fill="#9FC3BC" font-size="20">sbartaula.github.io</text>

  <g filter="url(#shadow)">
    <rect x="735" y="100" width="397" height="430" rx="32" fill="url(#card)"/>
    <rect x="772" y="140" width="323" height="72" rx="18" fill="#F8FBFA"/>
    <circle cx="807" cy="176" r="10" fill="#0F766E"/>
    <text x="832" y="169" class="sans" fill="#4F645D" font-size="14" font-weight="700" letter-spacing="2">AMBIGUOUS IDEA</text>
    <text x="832" y="191" class="sans" fill="#14211D" font-size="18" font-weight="600">Define the useful loop</text>

    <path d="M934 221V252" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
    <path d="M925 244L934 253L943 244" stroke="#0F766E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="772" y="261" width="323" height="108" rx="18" fill="#0F766E"/>
    <text x="807" y="296" class="sans" fill="#BDE5DF" font-size="14" font-weight="700" letter-spacing="2">ENGINEERED SYSTEM</text>
    <text x="807" y="326" class="sans" fill="white" font-size="19" font-weight="700">Model + backend + guardrails</text>
    <text x="807" y="351" class="sans" fill="#DDF4EF" font-size="16">Measure failure, reliability, utility</text>

