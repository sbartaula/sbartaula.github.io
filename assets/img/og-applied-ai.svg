<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Saroj, Applied AI and Product Engineer</title>
  <desc id="description">Social preview card for Saroj's portfolio, focused on applied AI, backend systems, and product engineering.</desc>

  <defs>
    <linearGradient id="background" x1="70" y1="20" x2="1135" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123F39"/>
      <stop offset="0.56" stop-color="#0B2F2B"/>
      <stop offset="1" stop-color="#071F1D"/>
    </linearGradient>
    <linearGradient id="card" x1="777" y1="111" x2="1102" y2="519" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DDF4EF"/>
      <stop offset="1" stop-color="#A8D8CF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <g opacity="0.09" stroke="#BDE5DF">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M100 0V630M200 0V630M300 0V630M400 0V630M500 0V630M600 0V630M700 0V630M800 0V630M900 0V630M1000 0V630M1100 0V630"/>
  </g>
  <circle cx="1116" cy="80" r="230" fill="#0F766E" fill-opacity="0.18"/>
  <circle cx="1017" cy="539" r="280" fill="#2A7E75" fill-opacity="0.10"/>

