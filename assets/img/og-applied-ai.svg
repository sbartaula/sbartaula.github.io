  <text x="72" y="184" class="sans" fill="white" font-size="70" font-weight="800" letter-spacing="-2">Saroj</text>
  <text x="72" y="254" class="sans" fill="#E7F6F3" font-size="37" font-weight="600">Building AI-enabled products</text>
  <text x="72" y="302" class="sans" fill="#E7F6F3" font-size="37" font-weight="600">from idea to working system.</text>

  <g class="sans" font-size="19" font-weight="600">
