<header class="site-header">
  <div>
    <a class="site-brand" href="{{ '/' | relative_url }}">
      <span>Saroj Bartaula</span>
      <span>Applied AI and Product Engineering</span>
    </a>
  </div>

  {% assign current_url = page.url | replace: 'index.html', '' %}
  <nav class="site-nav" aria-label="Main navigation">
    <div class="nav-primary">
      <a href="{{ '/projects/' | relative_url }}"{% if current_url == '/projects/' %} aria-current="page"{% endif %}>Work</a>
      <a href="{{ '/#experience' | relative_url }}">Experience</a>
      <a href="{{ '/writing/' | relative_url }}"{% if current_url contains '/writing/' %} aria-current="page"{% endif %}>Writing</a>
      <a href="{{ '/about/' | relative_url }}"{% if current_url == '/about/' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/resume/' | relative_url }}"{% if current_url == '/resume/' %} aria-current="page"{% endif %}>Resume</a>
    </div>
  </nav>
</header>
